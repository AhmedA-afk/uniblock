<!doctype html>
<!-- Streaming-player mock. The ad is part of the video's own timeline (its
     first 8 s), like stitched streaming ads. With ?lock=1 the player refuses
     seeks during the ad, like players that lock seeking. A Skip button
     appears after 3 s. A second player shows an ordinary video about ads. -->
<html><head><meta charset="utf-8"><style>
  .player { position: relative; width: 640px; height: 360px; margin: 16px; background: #000; }
  .player video { width: 100%; height: 100%; }
  .ad-ui { position: absolute; left: 12px; bottom: 12px; color: #fff; font: 14px system-ui; }
  .skip { position: absolute; right: 12px; bottom: 12px; display: none; }
  .title { position: absolute; left: 12px; top: 12px; color: #fff; font: 14px system-ui; }
</style></head><body>
<div class="player" id="p1">
  <video id="v1" src="/clip.webm" autoplay playsinline></video>
  <!-- Like Prime Video's overlay: "Ad" as its own text, a countdown, a link. -->
  <div class="ad-ui" id="adui"><span>Ad</span> <span id="pod">1 of 2</span> <span id="cd">0:08</span> <a href="#">Learn more</a></div>
  <button class="skip" id="skip">Skip</button>
</div>
<div class="player" id="p2">
  <video id="v2" src="/clip.webm" autoplay muted playsinline></video>
  <div class="title">Advertising in the 1960s — a documentary</div>
</div>
<script>
  const AD_END = 8;
  const lock = new URLSearchParams(location.search).has('lock');
  const v1 = document.getElementById('v1');
  // The viewer's own settings before the ad started.
  v1.muted = false; v1.volume = 0.8; v1.defaultPlaybackRate = 1.25; v1.playbackRate = 1.25;
  window.log = { skipped: false, seekRefused: 0, adEndedAt: null };
  const ui = document.getElementById('adui');
  let lastAdTime = 0, allowSeek = false;
  const endAd = () => { ui.remove(); document.getElementById('skip').remove(); window.log.adEndedAt = performance.now(); };
  // A locked player refuses a jump whichever event sees it first.
  const refuse = () => {
    if (!ui.isConnected || !lock || allowSeek || v1.currentTime <= lastAdTime + 0.5) return false;
    window.log.seekRefused++;
    v1.currentTime = lastAdTime;
    return true;
  };
  v1.addEventListener('timeupdate', () => {
    if (!ui.isConnected || refuse()) return;
    if (v1.currentTime >= AD_END) return endAd();
    lastAdTime = v1.currentTime;
    document.getElementById('cd').textContent = `0:0${Math.ceil(AD_END - v1.currentTime)}`;
  });
  v1.addEventListener('seeking', refuse);
  setTimeout(() => { if (ui.isConnected) document.getElementById('skip').style.display = 'block'; }, 3000);
  document.getElementById('skip').addEventListener('click', () => {
    window.log.skipped = true; allowSeek = true; v1.currentTime = AD_END;
  });
</script>
</body></html>
